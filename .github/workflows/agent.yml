name: Football Agent

on:
  schedule:
    - cron: "7,27,47 * * * *"   # tiap ~20 menit, menit ganjil supaya tidak kena antrean jam bulat
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode jalan manual"
        type: choice
        options: [normal, test, report, parlay]
        default: normal

# satu run pada satu waktu, supaya file data tidak bentrok
concurrency:
  group: football-agent
  cancel-in-progress: false

permissions:
  contents: write   # perlu untuk menyimpan sent.json, predictions.csv, elo_cache.json

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jalankan agent
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # pemicu cron-job.org tiap 15 menit; analisa dikirim 25-75 menit sebelum kick-off
          NOTIFY_MIN_MINUTES: "25"
          NOTIFY_MAX_MINUTES: "75"
          PARLAY_HOUR_WIB: "15"     # jam kombinasi harian dikirim (WIB)
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          MODE="$MODE_INPUT"
          case "$MODE" in
            test)   python agent_free.py --test ;;
            report) python agent_free.py --report ;;
            parlay) python agent_free.py --parlay ;;
            *)      python agent_free.py ;;
          esac

      - name: Simpan data (prediksi, rating, riwayat terkirim)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in sent.json predictions.csv elo_cache.json last_report.txt parlays.json last_parlay.txt crests.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
